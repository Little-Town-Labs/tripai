name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "[0-9][0-9][0-9]-*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: E2E
        run: npm run test:e2e
